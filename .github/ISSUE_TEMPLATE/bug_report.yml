name: Bug report
description: Something on the site is broken or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Please do not include personal data. For security problems, use the private reporting link in the Security tab instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone 15, Chrome on Windows 11
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
